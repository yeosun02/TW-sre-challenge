# Run the full stack: docker compose up --build
# Dashboard: http://localhost:3000
services:
  metrics-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      GRPC_BIND_ADDR: 0.0.0.0:3000
    ports:
      # gRPC for host-side tools (e.g. python main.py); www uses host :3000
      - "3002:3000"

  metrics-agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    depends_on:
      - metrics-server
    environment:
      METRICS_SERVER_HOST: metrics-server
      METRICS_SERVER_PORT: "3000"
      POLL_INTERVAL_SEC: "5"

  metrics-www:
    build:
      context: .
      dockerfile: www/Dockerfile
    depends_on:
      - metrics-server
    ports:
      - "3000:3000"
    environment:
      METRICS_SERVER_HOST: metrics-server
      METRICS_SERVER_PORT: "3000"
      PROTO_ROOT: /proto
